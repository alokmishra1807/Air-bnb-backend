apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hotelservice-hpa
  namespace: hotel-service-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hotelservice
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
