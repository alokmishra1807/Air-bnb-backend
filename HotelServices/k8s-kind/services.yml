apiVersion: v1
kind: Service
metadata:
  name: hotelservice
  namespace: hotel-service-ns
spec:
  type: NodePort
  selector:
    app: hotelservice
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: hotel-service-ns
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: hotel-service-ns
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
