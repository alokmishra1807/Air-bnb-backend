services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mysql
      - redis
    networks:
      - hotel-service-network
     

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - hotel-service-network

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    networks:
      - hotel-service-network

networks:
  hotel-service-network:
    driver: bridge